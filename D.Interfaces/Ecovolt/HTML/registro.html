<body>

    <main>
      <div class="registro-container">
      <div class="registro-form">
          <h2 class="form-title">Crear Cuenta</h2>
          <form>
              <div class="row">
                  <div class="col-md-6">
                      <div class="mb-3">
                          <label for="nombre" class="form-label">Nombre</label>
                          <input type="text" class="form-control" id="nombre" name="nombre" required>
                      </div>
                  </div>
                  <div class="col-md-6">
                      <div class="mb-3">
                          <label for="apellido" class="form-label">Apellido</label>
                          <input type="text" class="form-control" id="apellido" name="apellido" required>
                      </div>
                  </div>
              </div>
              
              <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" name="email" required>
              </div>
              
              <div class="mb-3">
                  <label for="direccion" class="form-label">Dirección</label>
                  <input type="text" class="form-control" id="direccion" name="direccion" required>
              </div>
              
              <div class="mb-3">
                  <label for="codigoPostal" class="form-label">Código Postal</label>
                  <input type="text" class="form-control" id="codigoPostal" name="codigoPostal" required>
              </div>
              
              <div class="mb-3">
                  <label for="contrasena" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="contrasena" name="contrasena" required>
              </div>
              
              <div class="d-grid">
                  <button type="submit" class="btn btn-primary coloresBotones btn-lg">Registrarse</button>
              </div>
              
              <div class="text-center mt-3">
                  <p>¿Ya tienes cuenta? <a href="../HTML/registro.html" class="text-decoration-none">Inicia Sesión</a></p>
              </div>
          </form>
      </div>
  </div>
    </main>
    
    <footer class="footer">
        <div class="footer_izq">
          <div class="oficina-item">
            <button class="toggle-map-btn" onclick="toggleMap('mapMadrid')">
              <h5>Oficina Madrid</h5>
              <span class="arrow">▼</span>
            </button>
            <div id="mapMadrid" class="map-container">
              <p>Calle Núñez de Balboa, 120. Madrid</p>
              <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6073.339170588849!2d-3.6840792879884003!3d40.438314754205436!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd4228c1ed7299b5%3A0xa3c0ef96cfa3c72e!2sCalle%20de%20N%C3%BA%C3%B1ez%20de%20Balboa%2C%20120%2C%20Chamart%C3%ADn%2C%2028006%20Madrid!5e0!3m2!1ses-419!2ses!4v1761475660377!5m2!1ses-419!2ses" width="100%" height="200" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
          </div>
          <div class="oficina-item">
            <button class="toggle-map-btn" onclick="toggleMap('mapSevilla')">
              <h5>Oficina Sevilla</h5>
              <span class="arrow">▼</span>
            </button>
            <div id="mapSevilla" class="map-container">
              <p>Parque científico y tecnológico Cartuja, Calle Isaac Newton 4. Sevilla</p>
              <iframe src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d3169.3355247133763!2d-6.007483038099148!3d37.405543633226046!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1sOficina%20Sevilla%20%E2%80%93%20Parque%20cient%C3%ADfico%20y%20tecnol%C3%B3gico%20Cartuja%2C%20Calle%20Isaac%20Newton%204.%20Sevilla!5e0!3m2!1ses-419!2ses!4v1761475696792!5m2!1ses-419!2ses" width="100%" height="200" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
          </div>
        </div> 
        <div class="footer_der">
          <h4>Contacto</h4>
          <div class="contacto-info">
            <p><strong>Teléfono:</strong></p>
            <p>912 345 678 // 611 234 567</p>
            <p><strong>Correo:</strong></p>
            <p>Ecovolt@gmail.com</p>
          </div>
        </div>
    </footer>
    
    <script>
        function toggleMap(mapId) {
            const mapContainer = document.getElementById(mapId);
            const button = mapContainer.previousElementSibling;
            const arrow = button.querySelector('.arrow');
            
            if (mapContainer.style.display === 'none' || mapContainer.style.display === '') {
                mapContainer.style.display = 'block';
                arrow.textContent = '▲';
            } else {
                mapContainer.style.display = 'none';
                arrow.textContent = '▼';
            }
        }
        
        
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('mapMadrid').style.display = 'none';
            document.getElementById('mapSevilla').style.display = 'none';
        });
    </script>
</body>
