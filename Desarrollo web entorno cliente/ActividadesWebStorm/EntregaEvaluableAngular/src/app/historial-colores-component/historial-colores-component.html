º<h2>Navegación de historial</h2>

<div class="recuadro" [style.background-color]="colorActual()">
  {{ nombreColor(colorActual()) }}
</div>

<div>
  @for (color of colores; track color.valor) {
    <button class="opcion"
            [style.background-color]="color.valor"
            [class.seleccionado]="color.valor === colorActual()"
            (click)="elegirColor(color.valor)">
      {{ color.nombre }}
    </button>
  }
</div>

<div>
  <button (click)="atras()" [disabled]="posicion() === 0">Atrás</button>
  <button (click)="adelante()" [disabled]="posicion() === historial().length - 1">Adelante</button>
</div>

<p>
  Cambios registrados: <strong>{{ historial().length - 1 }}</strong> ·
  Estás en el cambio: <strong>{{ posicion() }}</strong>
  @if (posicion() === 0) {
    (color inicial)
  }
</p>

<div>
  <label for="pasos">Retroceder</label>
  <input type="number" id="pasos" min="1" [(ngModel)]="pasosRetroceso">
  <label for="pasos">cambios</label>
  <button (click)="retroceder()">Retroceder</button>
</div>

@if (mensaje()) {
  <p class="error">{{ mensaje() }}</p>
}
