<h2>localStorage</h2>

@if (nombre()) {
  <p>
    Hola, <strong>{{ nombre() }}</strong>.
    Esta es tu visita número <strong>{{ visitas() }}</strong>.
    @if (ultimaVisita()) {
      Tu última visita fue el <strong>{{ ultimaVisita() }}</strong>.
    } @else {
      Es tu primera visita.
    }
  </p>
} @else {
  <div>
    <label for="nombreLocal">¿Cómo te llamas?</label>
    <input type="text" id="nombreLocal" [(ngModel)]="nombreEscrito">
    <button (click)="guardarNombre()">Guardar</button>
  </div>
}

<div>
  Tema:
  <button [class.seleccionado]="tema() === 'claro'" (click)="elegirTema('claro')">Claro</button>
  <button [class.seleccionado]="tema() === 'oscuro'" (click)="elegirTema('oscuro')">Oscuro</button>
</div>

<div>
  <button (click)="borrar()">Eliminar localStorage</button>
</div>

@if (mensaje()) {
  <p class="error">{{ mensaje() }}</p>
}
